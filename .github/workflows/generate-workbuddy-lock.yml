name: Generate WorkBuddy package lock

on:
  push:
    branches:
      - feat/workbuddy-workbench
    paths:
      - package.json
      - .github/workflows/generate-workbuddy-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'Jegozhou/instaloader' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/workbuddy-workbench

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package lock when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- package-lock.json)" ]]; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock WorkBuddy npm dependencies'
          git push origin HEAD:feat/workbuddy-workbench
